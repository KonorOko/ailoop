[package]
name = "ailoop"
description = "High-level façade for building LLM agent loops in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["llm", "ai", "agent", "anthropic", "openai"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
ailoop-core.workspace = true
ailoop-context.workspace = true
ailoop-tools.workspace = true
ailoop-prompts.workspace = true
ailoop-derive.workspace = true

futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-stream.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing = { workspace = true, optional = true }

[features]
tracing = ["dep:tracing"]

[dev-dependencies]
ailoop-core = { workspace = true, features = ["testing"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
