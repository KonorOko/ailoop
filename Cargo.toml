[workspace]
members = [
    "ailoop",
    "ailoop-anthropic",
    "ailoop-azure-openai",
    "ailoop-context",
    "ailoop-core",
    "ailoop-derive",
    "ailoop-mcp",
    "ailoop-prompts",
    "ailoop-tools",
    "examples/basic-chat",
    "examples/mcp-time",
    "examples/tool-use",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ailoop authors"]

[workspace.dependencies]
ailoop = { path = "ailoop" }
ailoop-core = { path = "ailoop-core" }
ailoop-prompts = { path = "ailoop-prompts" }
ailoop-context = { path = "ailoop-context" }
ailoop-tools = { path = "ailoop-tools" }
ailoop-anthropic = { path = "ailoop-anthropic" }
ailoop-azure-openai = { path = "ailoop-azure-openai" }
ailoop-derive = { path = "ailoop-derive" }
ailoop-mcp = { path = "ailoop-mcp" }

async-trait = "0.1.89"
async-stream = "0.3.6"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
indexmap = "2.14.0"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
eventsource-stream = "0.2.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15.7"
tempfile = "3"
syn = { version = "2.0.117", features = ["full"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"
proc-macro-crate = "3.4.0"
convert_case = "0.11.0"
