[workspace]
members = [
    "ailoop",
    "ailoop-core",
    "ailoop-history",
    "ailoop-derive",
    "ailoop-prompts",
    "ailoop-tools",
    "adapters/anthropic",
    "adapters/azure-openai",
    "adapters/mcp",
    "examples/basic-chat",
    "examples/deferred-tools",
    "examples/mcp-time",
    "examples/persistent-chat",
    "examples/tool-use",
]
resolver = "3"

[workspace.package]
version = "1.0.0-rc.3"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ailoop authors"]
repository = "https://github.com/KonorOko/ailoop"
homepage = "https://github.com/KonorOko/ailoop"

[workspace.dependencies]
ailoop = { path = "ailoop", version = "1.0.0-rc.3" }
ailoop-core = { path = "ailoop-core", version = "1.0.0-rc.3" }
ailoop-prompts = { path = "ailoop-prompts", version = "1.0.0-rc.3" }
ailoop-history = { path = "ailoop-history", version = "1.0.0-rc.3" }
ailoop-tools = { path = "ailoop-tools", version = "1.0.0-rc.3" }
ailoop-anthropic = { path = "adapters/anthropic", version = "1.0.0-rc.3" }
ailoop-azure-openai = { path = "adapters/azure-openai", version = "1.0.0-rc.3" }
ailoop-derive = { path = "ailoop-derive", version = "1.0.0-rc.3" }
ailoop-mcp = { path = "adapters/mcp", version = "1.0.0-rc.3" }

async-trait = "0.1.89"
async-stream = "0.3.6"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
indexmap = "2.14.0"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
eventsource-stream = "0.2.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15.7"
tempfile = "3"
syn = { version = "2.0.117", features = ["full"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"
proc-macro-crate = "3.4.0"
convert_case = "0.11.0"
